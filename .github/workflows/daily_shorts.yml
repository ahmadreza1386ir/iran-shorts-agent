name: Daily Iranian Shorts Pipeline

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      scenes:
        description: "Number of scenes per short"
        required: false
        default: "11"
      upload_id:
        description: "Short ID to upload to YouTube (leave empty to auto-use newly generated short)"
        required: false
        default: ""
      privacy:
        description: "YouTube privacy status (private / unlisted / public)"
        required: false
        default: "private"
      skip_generate:
        description: "Set to true to skip generation and only upload upload_id (saves Hormouz tokens)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build_and_stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pillow google-api-python-client google-auth-oauthlib

      - name: Generate script, audio, visuals, and assemble short
        if: ${{ github.event.inputs.skip_generate != 'true' }}
        env:
          HORMOUZ_API_KEY: ${{ secrets.HORMOUZ_API_KEY }}
          HORMOUZ_BASE_URL: ${{ secrets.HORMOUZ_BASE_URL }}
          HORMOUZ_CHAT_MODEL: ${{ secrets.HORMOUZ_CHAT_MODEL }}
          HORMOUZ_IMAGE_MODELS: ${{ secrets.HORMOUZ_IMAGE_MODELS }}
          HORMOUZ_IMAGE_SIZE: "9:16"
        run: |
          SCENES="${{ github.event.inputs.scenes || '11' }}"
          python 01_llm_writer.py --count 1 --scenes "$SCENES"
          NEW_ID=$(python -c "import json; d=json.load(open('data/scripts_batch_1.json', encoding='utf-8-sig')); print(d[-1]['id'])")
          echo "NEW_ID=$NEW_ID" >> "$GITHUB_ENV"
          python 02_voice_and_subs.py --only "$NEW_ID"
          python 02b_fetch_visuals.py --only "$NEW_ID" --reset-providers
          python 03_video_assembler.py --only "$NEW_ID"
          python verify_outputs.py || true

      - name: Upload video to YouTube (private by default for review in YouTube Studio)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.upload_id != '' || github.event.inputs.skip_generate != 'true' }}
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YT_CLIENT_SECRET_JSON" ] || [ -z "$YT_TOKEN_JSON" ]; then
            echo "Missing YOUTUBE_CLIENT_SECRET_JSON or YOUTUBE_TOKEN_JSON secret."
            exit 1
          fi

          printf "%s" "$YT_CLIENT_SECRET_JSON" > client_secret.json
          printf "%s" "$YT_TOKEN_JSON" > token.json

          TARGET_ID="${{ github.event.inputs.upload_id }}"
          if [ -z "$TARGET_ID" ]; then
            TARGET_ID="${{ env.NEW_ID }}"
          fi

          if [ -z "$TARGET_ID" ]; then
            echo "No TARGET_ID found to upload."
            exit 1
          fi

          if [ ! -f "output/pending_approval/short_${TARGET_ID}.mp4" ] && [ ! -f "output/approved/short_${TARGET_ID}.mp4" ]; then
            python 02_voice_and_subs.py --only "$TARGET_ID"
            python 03_video_assembler.py --only "$TARGET_ID"
          fi

          python 04_youtube_uploader.py --id "$TARGET_ID" --privacy "${{ github.event.inputs.privacy || 'private' }}" --no-local-auth

      - name: Upload pending video artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: pending-short-${{ github.event.inputs.upload_id || env.NEW_ID || 'latest' }}
          path: |
            output/pending_approval/*.mp4
            output/approved/*.mp4
            data/scripts_batch_1.json
            data/visual_plan.json
            data/uploaded_shorts.json
          if-no-files-found: ignore

      - name: Commit updated scripts, plan, and upload log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- output/ assets/ client_secret.json token.json 2>/dev/null || true
          git add -f data/uploaded_shorts.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update generated short data [skip ci]"
            git push
          fi
